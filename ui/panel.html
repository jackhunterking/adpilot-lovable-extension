<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdPilot for Lovable</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    
    #root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .panel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      max-width: 500px;
      padding: 40px;
      text-align: center;
    }
    
    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo svg {
      width: 32px;
      height: 32px;
      fill: white;
    }
    
    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
      margin: 0;
    }
    
    p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.5;
    }
    
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      font-size: 13px;
      color: #3b82f6;
    }
    
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(59, 130, 246, 0.3);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .info {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 20px;
    }
    
    .project-info {
      background: rgba(255, 255, 255, 0.05);
      padding: 16px;
      border-radius: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      text-align: left;
      width: 100%;
    }
    
    .project-info dt {
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 8px;
    }
    
    .project-info dt:first-child {
      margin-top: 0;
    }
    
    .project-info dd {
      margin-left: 0;
      margin-top: 4px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="panel-container">
      <div class="logo">
        <svg viewBox="0 0 16 16">
          <path d="M13 2L3 6v4l10 4V2zM2 7h1v2H2V7zm13 5.5l-9-3.6V7.1l9-3.6v8.5z"/>
        </svg>
      </div>
      
      <h1>AdPilot for Lovable</h1>
      
      <p>Create and manage Meta ads directly from your Lovable editor</p>
      
      <div class="status">
        <div class="spinner"></div>
        <span id="status-text">Connecting to project...</span>
      </div>
      
      <div id="project-info" class="project-info" style="display: none;">
        <dl>
          <dt>Project ID:</dt>
          <dd id="project-id">-</dd>
          <dt>Project URL:</dt>
          <dd id="project-url">-</dd>
        </dl>
      </div>
      
      <p class="info">
        <a href="/lovable/create-ad" style="color: #3b82f6; text-decoration: underline;">
          Go to Ad Builder →
        </a><br>
        Create ads with dual format support (square + vertical)
      </p>
    </div>
  </div>
  
  <script>
    console.log('[AdPilot Panel] Panel loaded');
    
    // Listen for project context from extension
    window.addEventListener('message', (event) => {
      // Accept messages from parent (extension content script)
      if (event.data && event.data.type === 'ADPILOT_PROJECT_CONTEXT') {
        console.log('[AdPilot Panel] Project context received:', event.data.payload);
        
        const { lovableProjectId, lovableProjectUrl } = event.data.payload;
        
        // Update UI
        document.getElementById('status-text').textContent = 'Connected to project ✓';
        document.getElementById('project-id').textContent = lovableProjectId || 'Unknown';
        document.getElementById('project-url').textContent = lovableProjectUrl || 'Unknown';
        document.getElementById('project-info').style.display = 'block';
        
        // Store context
        sessionStorage.setItem('adpilot_lovable_context', JSON.stringify(event.data.payload));
      }
    });
    
    // Request context from extension on load
    console.log('[AdPilot Panel] Requesting project context...');
    window.parent.postMessage({
      type: 'ADPILOT_REQUEST_CONTEXT',
      timestamp: Date.now()
    }, '*');
    
    // Retry every 2 seconds if no response
    let retries = 0;
    const retryInterval = setInterval(() => {
      if (sessionStorage.getItem('adpilot_lovable_context')) {
        clearInterval(retryInterval);
        return;
      }
      
      if (retries < 5) {
        console.log('[AdPilot Panel] Retrying context request...', retries + 1);
        window.parent.postMessage({
          type: 'ADPILOT_REQUEST_CONTEXT',
          timestamp: Date.now()
        }, '*');
        retries++;
      } else {
        clearInterval(retryInterval);
        document.getElementById('status-text').textContent = 'Waiting for project info...';
      }
    }, 2000);
  </script>
</body>
</html>
